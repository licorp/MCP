[project]
name = "mcp-server-for-revit"
version = "0.1.0"
description = "MCP server for Revit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]==1.30.0",
    "httpx==0.28.1",
    "pymupdf>=2.0",
    "shapely>=2.2.0",
    "pillow>=13.0.0",
]

[tool.setuptools.packages.find]
include = ["tools*", "revit_mcp*"]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require a running Revit instance (slow)",
]
